name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Run regression and backend tests
        run: npm test
      - name: Remove runner paths from native binaries
        shell: pwsh
        run: |
          $flags=@("--remap-path-prefix=$env:GITHUB_WORKSPACE=undertone","--remap-path-prefix=$env:USERPROFILE=build-home")
          "CARGO_ENCODED_RUSTFLAGS=$($flags -join [char]31)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and publish signed update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Undertone ${{ github.ref_name }}
          releaseBody: Windows installer and signed in-app update.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --features external-lyrics
      - name: Replace API asset URLs in the updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/patch-updater-manifest.ps1 -Repository $env:RELEASE_REPOSITORY -Tag $env:RELEASE_TAG
