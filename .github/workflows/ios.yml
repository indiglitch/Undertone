name: Build iPhone IPA for SideStore
on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-companion']
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with Liquid Glass SDK
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo 'Xcode 26 or newer is required for native Liquid Glass.' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Start real PC networking fixture
        run: |
          cargo build --manifest-path phone-sync/Cargo.toml
          python3 scripts/prepare-ios-network-test.py
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Run persistence and original-file tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          echo "IOS_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project ios/Undertone.xcodeproj -scheme Undertone -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/test-build CODE_SIGNING_ALLOWED=NO
          xcodebuild test-without-building -project ios/Undertone.xcodeproj -scheme Undertone -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 -default-test-execution-time-allowance 90 -derivedDataPath ios/test-build -resultBundlePath ios/TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Collect native network diagnostics
        if: always()
        run: |
          find /var/folders -path '*undertone-ios-network-*/server.log' -exec cat {} \; 2>/dev/null || true
      - name: Capture native Liquid Glass screen
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          xcrun simctl install "$IOS_SIMULATOR_ID" ios/test-build/Build/Products/Debug-iphonesimulator/Undertone.app
          xcrun simctl status_bar "$IOS_SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl launch "$IOS_SIMULATOR_ID" local.undertone.ios
          sleep 3
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot ios/Undertone-iPhone.png
      - name: Build unsigned device application
        run: |
          xcodebuild build -project ios/Undertone.xcodeproj -scheme Undertone -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA for local SideStore signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/package/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Undertone.app ios/package/Payload/
          codesign --force --sign - --generate-entitlement-der ios/package/Payload/Undertone.app
          codesign --verify --strict ios/package/Payload/Undertone.app
          cd ios/package
          zip -q -r ../Undertone-SideStore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Undertone-SideStore
          path: ios/Undertone-SideStore.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-native-preview
          path: ios/Undertone-iPhone.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
