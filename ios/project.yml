name: Undertone
options:
  bundleIdPrefix: local.undertone
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.6.3'
targets:
  Undertone:
    type: application
    platform: iOS
    sources:
      - Undertone
      - path: Vorbis
        excludes: [stb_vorbis.c, LICENSE, SOURCE.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.undertone.ios
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: Undertone/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Vorbis/UndertoneVorbis.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  UndertoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Undertone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
  UndertoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Undertone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  Undertone:
    build:
      targets:
        Undertone: all
    test:
      targets: [UndertoneTests, UndertoneUITests]
